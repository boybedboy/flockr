workflows:
  android-apk:
    name: Flockr Android APK
    instance_type: linux_x2
    max_build_duration: 30
    working_directory: app
    environment:
      flutter: stable
      vars:
        # set API_URL in Codemagic > App settings > Environment variables
        API_URL: http://10.0.2.2:3100
    triggering:
      events: [push]
      branch_patterns:
        - pattern: main
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Analyze
        script: flutter analyze --no-fatal-infos
      - name: Build APK
        script: flutter build apk --release --dart-define=API=$API_URL
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
