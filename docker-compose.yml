services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: flockr
      POSTGRES_PASSWORD: flockr
      POSTGRES_DB: flockr
    ports:
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flockr"]
      interval: 5s
      retries: 10

  server:
    build: ./server
    environment:
      DATABASE_URL: postgres://flockr:flockr@db:5432/flockr
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
      PORT: 3100
    ports:
      - "3100:3100"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
